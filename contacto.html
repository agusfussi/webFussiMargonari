    <div class="titulo">
        <h2>Contáctanos</h2>
        <h3>¡Puedes mandarnos un mensaje por correo o por nuestro teléfono!</h3>
    </div>

    <form action="https://formsubmit.co/margonariaugusto@gmail.com" method="POST">
        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Mensaje:</label>
            <textarea id="message" name="msg" rows="4" required></textarea>
        </div>

        <button type="submit">Enviar</button>
        <input type="hidden" name="_captcha" value="false">
    </form>

    <div class="imagenw">
        <a target="_blank" rel="noopener noreferrer" href="https://wa.me/"><img src="fotos/whatsapp.png" alt="WhatsApp"></a>
    </div>

    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="script.js"></script>
